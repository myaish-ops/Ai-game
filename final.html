,aiScore)}</div><p class="callout"><strong>One thing to notice</strong><br>${esc(r.perceptionNote)}</p>${r.credit?`<p class="muted" style="font-size:.75em">${esc(r.credit)}</p>`:''}<section id="rankCard" class="card rank-card hidden" aria-live="polite"><strong>${rank?`Your leaderboard place: #${rank}`:'Not in the top 10 yet'}</strong></section><button id="nextBtn" class="next-player">Next player <span aria-hidden="true">→</span></button>`;document.getElementById('nextBtn').onclick=next;animateScoreCounts();if(playerWon)setTimeout(launchConfetti,120);document.querySelectorAll('.result').forEach((el,i)=>setTimeout(()=>el.classList.add('show'),150+i*500));setTimeout(()=>{const card=document.getElementById('rankCard');if(card){card.classList.remove('hidden');requestAnimationFrame(()=>card.classList.add('show'))}},1250)}
function submitRound(){if(state.screen!=='round'||!state.photoReady)return;clearInterval(state.timer);reveal()}
function next(){if(state.screen!=='reveal')return;state.roundCursor=takeNextRound();state.name='';state.total=0;splashScreen()}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&state.screen==='reveal'&&!document.getElementById('adminOverlay')&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}});
let adminReturnFocus=null,resetTimer=null,removeTimer=null;function adminContent(){const a=plays(),top=leaders().slice(0,10),average=a.length?Math.round(a.reduce((sum,x)=>sum+(Number(x.score)||0),0)/a.length):0;const panel=document.getElementById('adminPanel');panel.innerHTML=`<div class="row"><h2 id="adminTitle">Admin panel</h2><button id="adminClose" class="ghost" aria-label="Close admin panel">×</button></div><div class="admin-stats"><div>Total plays<br><strong>${a.length}</strong></div><div>Average score<br><strong>${average}</strong></div></div>${a.length?'':'<p class="muted">No plays yet</p>'}<h3>Top 10</h3>${top.length?`<ol class="leaderboard">${top.map(x=>`<li>${esc(isNameAllowed(x.name)?x.name:'Player')} — ${Number(x.score||0).toLocaleString()} pts${x.id?` <button class="ghost admin-remove" data-entry-id="${esc(x.id)}" style="font-size:.7em;padding:.25em .5em;margin-left:.5em">Remove</button>`:''}</li>`).join('')}</ol>`:'<p class="muted">No leaderboard scores yet.</p>'}<div class="row"><button id="adminExport" ${a.length?'':'disabled'}>Export CSV</button><button id="adminReset" class="ghost">Reset leaderboard</button></div>`;document.getElementById('adminClose').onclick=closeAdmin;document.getElementById('adminExport').onclick=exportCsv;document.getElementById('adminReset').onclick=resetLeaderboard;document.querySelectorAll('.admin-remove').forEach(button=>button.onclick=()=>removeLeaderEntry(button))}
function openAdmin(){if(state.screen==='round'||document.getElementById('adminOverlay'))return;adminReturnFocus=document.activeElement;const overlay=document.createElement('div');overlay.id='adminOverlay';overlay.className='admin-overlay';overlay.innerHTML='<section id="adminPanel" class="admin-panel" role="dialog" aria-modal="true" aria-labelledby="adminTitle"></section>';document.body.appendChild(overlay);adminContent();document.getElementById('adminClose').focus()}
function closeAdmin(){clearTimeout(resetTimer);clearTimeout(removeTimer);const overlay=document.getElementById('adminOverlay');if(!overlay)return;overlay.remove();adminReturnFocus?.focus?.();adminReturnFocus=null}
function removeLeaderEntry(button){const id=button.dataset.entryId;if(button.dataset.confirm==='yes'){clearTimeout(removeTimer);try{localStorage.setItem(LEADER,JSON.stringify(leaders().filter(x=>x.id!==id)));localStorage.setItem(PLAYS,JSON.stringify(plays().filter(x=>x.id!==id)))}catch{}adminContent();document.getElementById('adminClose').focus();return}document.querySelectorAll('.admin-remove').forEach(other=>{other.dataset.confirm='';other.textContent='Remove'});clearTimeout(removeTimer);button.dataset.confirm='yes';button.textContent='Click again to confirm';removeTimer=setTimeout(()=>{if(button.isConnected){button.dataset.confirm='';button.textContent='Remove'}},4000)}
function csvValue(value){let text=String(value??'');if(/^\s*[=+\-@]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`}
function exportCsv(){const a=plays();if(!a.length)return;const rows=[['name','score','date','round'],...a.map(x=>[x.name??'',x.score??'',x.date??'',x.round??''])],csv='\uFEFF'+rows.map(row=>row.map(csvValue).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=`ai-perception-scores-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetLeaderboard(){const button=document.getElementById('adminReset');if(button.dataset.confirm==='yes'){clearTimeout(resetTimer);try{localStorage.removeItem(LEADER);localStorage.removeItem(PLAYS)}catch{}adminContent();document.getElementById('adminReset').focus();return}button.dataset.confirm='yes';button.textContent='Click again to confirm';resetTimer=setTimeout(()=>{if(button.isConnected){button.dataset.confirm='';button.textContent='Reset leaderboard'}},4000)}
document.addEventListener('keydown',e=>{const overlay=document.getElementById('adminOverlay');if(e.ctrlKey&&e.shiftKey&&e.code==='KeyA'){if(state.screen==='round')return;e.preventDefault();overlay?closeAdmin():openAdmin();return}if(!overlay)return;if(e.key==='Escape'){e.preventDefault();closeAdmin();return}if(e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not(:disabled)')],first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}},true);
splashScreen();
</script></body></html>
